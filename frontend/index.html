<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Month-End Process</title>
<style>
  :root {
    --gray: #6b7280; --gray-bg: #f3f4f6;
    --blue: #2563eb; --blue-bg: #dbeafe;
    --amber: #b45309; --amber-bg: #fef3c7;
    --green: #15803d; --green-bg: #dcfce7;
    --slate: #94a3b8; --slate-bg: #f1f5f9;
    --border: #e5e7eb;

    /* Task status colors */
    --status-red: #b91c1c; --status-red-bg: #fee2e2;
    --status-orange: #c2410c; --status-orange-bg: #ffedd5;
    --status-lgreen: #4d7c0f; --status-lgreen-bg: #ecfccb;
    --status-dgreen: #14532d; --status-dgreen-bg: #86efac;
    --status-grey: #6b7280; --status-grey-bg: #f1f5f9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #fafafa; color: #111827; font-size: 14px;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    background: #fff; border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; margin-right: 8px; white-space: nowrap; }
  select, input, button, textarea {
    font-family: inherit; font-size: 13px; padding: 6px 8px;
    border: 1px solid var(--border); border-radius: 6px; background: #fff;
  }
  button {
    cursor: pointer; background: #111827; color: #fff; border: none;
  }
  button:hover { background: #1f2937; }
  button.secondary { background: #fff; color: #111827; border: 1px solid var(--border); }
  button.secondary:hover { background: #f3f4f6; }
  button.danger { background: #fff; color: #b91c1c; border: 1px solid #fecaca; }
  button.danger:hover { background: #fef2f2; }
  .spacer { flex: 1; }
  .cycle-badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600;
    text-transform: uppercase;
  }
  .cycle-badge.open { background: var(--blue-bg); color: var(--blue); }
  .cycle-badge.locked { background: var(--amber-bg); color: var(--amber); }
  .cycle-badge.archived { background: var(--gray-bg); color: var(--gray); }

  main { padding: 16px 20px; }
  .toolbar { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
  .toolbar label { display: flex; align-items: center; gap: 6px; color: #374151; }

  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--border); }
  th, td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #f9fafb; font-size: 12px; text-transform: uppercase; color: #6b7280; position: sticky; top: 0; }
  tr.completed-row { opacity: 0.55; }
  tr:hover { background: #f9fafb; }
  tr.dragging { opacity: 0.4; }
  tr.drag-over { box-shadow: inset 0 2px 0 0 #2563eb; }
  .drag-handle { cursor: grab; text-align: center; color: #9ca3af; user-select: none; }
  .drag-handle:active { cursor: grabbing; }
  td input, td select, td textarea {
    width: 100%; border: 1px solid transparent; background: transparent; padding: 4px;
  }
  td input:hover, td select:hover, td textarea:hover { border-color: var(--border); }
  td input:focus, td select:focus, td textarea:focus { border-color: #9ca3af; background: #fff; }
  textarea { resize: vertical; min-height: 32px; }
  .col-name { min-width: 200px; }
  .col-desc { min-width: 220px; }
  .col-links { min-width: 170px; }
  .link-row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
  .link-row input { min-width: 0; }
  .link-row a { flex-shrink: 0; text-decoration: none; }
  .status-select { font-weight: 600; border-radius: 999px; padding: 4px 8px; cursor: pointer; }
  .status-not_started { background: var(--status-red-bg); color: var(--status-red); }
  .status-waiting { background: var(--status-orange-bg); color: var(--status-orange); }
  .status-in_progress { background: var(--status-lgreen-bg); color: var(--status-lgreen); }
  .status-done { background: var(--status-dgreen-bg); color: var(--status-dgreen); }
  .status-n_a { background: var(--status-grey-bg); color: var(--status-grey); }

  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-backdrop.show { display: flex; }
  .modal { background: #fff; border-radius: 10px; padding: 20px; width: 420px; max-width: 90vw; max-height: 85vh; overflow: auto; }
  .modal.modal-wide { width: 560px; }
  .task-detail-subtitle { color: #6b7280; font-size: 12px; margin-top: -8px; margin-bottom: 12px; }
  .modal h2 { margin-top: 0; font-size: 16px; }
  .modal .field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
  .modal .field label { font-size: 12px; color: #6b7280; }
  .modal .field input, .modal .field select { padding: 8px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .user-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .user-row span { flex: 1; }
  .empty-state { padding: 40px; text-align: center; color: #9ca3af; }

  .tab-btn {
    background: none; border: none; color: #6b7280; font-weight: 600;
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
  }
  .tab-btn:hover { background: #f3f4f6; color: #111827; }
  .tab-btn.active { background: #111827; color: #fff; }
  .checklist-header-controls { display: flex; align-items: center; gap: 12px; }

  .overview-cell { text-align: center; }
  .overview-date { font-size: 11px; color: #6b7280; margin-top: 2px; }
  .status-pill {
    display: inline-block; font-weight: 600; font-size: 12px;
    border-radius: 999px; padding: 4px 10px;
  }
  button.pill-btn { border: none; cursor: pointer; }
  button.pill-btn:hover { box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.15); }
  .cycle-link {
    background: none; border: none; color: #2563eb; font-weight: 700;
    font-size: 12px; text-transform: uppercase; cursor: pointer; padding: 0;
  }
  .cycle-link:hover { background: none; text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>Month-End Process</h1>
  <button class="tab-btn" id="tabOverviewBtn">Overview</button>
  <button class="tab-btn" id="tabChecklistBtn">Checklist</button>
  <div class="checklist-header-controls" id="checklistHeaderControls" style="display:none">
    <select id="cycleSelect"></select>
    <span id="cycleStatusBadge" class="cycle-badge"></span>
    <select id="cycleStatusSelect" title="Change cycle status"></select>
    <button class="secondary" id="newCycleBtn">+ New Cycle</button>
    <button class="secondary" id="cloneCycleBtn">Clone into new month</button>
  </div>
  <div class="spacer"></div>
  <button class="secondary" id="manageUsersBtn">Users</button>
</header>

<main>
  <div id="overviewPanel">
    <div id="overviewEmptyState" class="empty-state" style="display:none">No cycles yet — create one to get started.</div>
    <div id="overviewTableWrap">
      <table id="overviewTable">
        <thead><tr id="overviewHeaderRow"></tr></thead>
        <tbody id="overviewBody"></tbody>
      </table>
    </div>
  </div>

  <div id="checklistPanel" style="display:none">
  <div class="toolbar">
    <label><input type="checkbox" id="hideCompleted"> Hide completed</label>
    <select id="filterBookingResp"></select>
    <select id="filterBookingStatus"></select>
    <select id="filterQualityCheck"></select>
    <button class="secondary" id="clearFiltersBtn">Clear filters</button>
    <div class="spacer"></div>
    <button id="addTaskBtn">+ Add Task</button>
  </div>

  <div id="tableWrap">
    <table id="taskTable">
      <thead>
        <tr>
          <th style="width:24px"></th>
          <th class="col-name">Task</th>
          <th class="col-desc">Description</th>
          <th>Dependency</th>
          <th style="width:70px">Due</th>
          <th style="width:160px">Booking Responsible</th>
          <th style="width:130px">Booking Status</th>
          <th style="width:140px">Quality Check</th>
          <th style="width:130px">Check Status</th>
          <th style="width:110px">Finished</th>
          <th>Comment</th>
          <th class="col-links">Links</th>
          <th style="width:24px"></th>
        </tr>
      </thead>
      <tbody id="taskBody"></tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none">No cycles yet — create one to get started.</div>
  </div>
  </div>
</main>

<!-- New / Clone cycle modal -->
<div class="modal-backdrop" id="cycleModalBackdrop">
  <div class="modal">
    <h2 id="cycleModalTitle">New Cycle</h2>
    <div class="field">
      <label>Label</label>
      <input type="text" id="cycleLabelInput" placeholder="2026-07">
    </div>
    <div class="field">
      <label>Year</label>
      <input type="number" id="cycleYearInput">
    </div>
    <div class="field">
      <label>Month (1-12)</label>
      <input type="number" id="cycleMonthInput" min="1" max="12">
    </div>
    <div class="actions">
      <button class="secondary" id="cycleModalCancel">Cancel</button>
      <button id="cycleModalSave">Create</button>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div class="modal-backdrop" id="confirmModalBackdrop">
  <div class="modal">
    <h2 id="confirmModalMessage">Are you sure?</h2>
    <div class="actions">
      <button class="secondary" id="confirmModalCancel">Cancel</button>
      <button class="danger" id="confirmModalOk">Delete</button>
    </div>
  </div>
</div>

<!-- New task modal -->
<div class="modal-backdrop" id="taskModalBackdrop">
  <div class="modal">
    <h2>New Task</h2>
    <div class="field">
      <label>Task name</label>
      <input type="text" id="taskNameInput" placeholder="Task name">
    </div>
    <div class="actions">
      <button class="secondary" id="taskModalCancel">Cancel</button>
      <button id="taskModalSave">Add</button>
    </div>
  </div>
</div>

<!-- Users modal -->
<div class="modal-backdrop" id="usersModalBackdrop">
  <div class="modal">
    <h2>Users</h2>
    <div id="usersList"></div>
    <div class="field" style="margin-top:12px">
      <label>Add user</label>
      <input type="text" id="newUserName" placeholder="Full name">
    </div>
    <div class="actions">
      <button class="secondary" id="usersModalClose">Close</button>
      <button id="usersModalAdd">Add</button>
    </div>
  </div>
</div>

<!-- Task detail modal (quick edit from Overview) -->
<div class="modal-backdrop" id="taskDetailModalBackdrop">
  <div class="modal modal-wide">
    <h2 id="taskDetailTitle">Task</h2>
    <div id="taskDetailSubtitle" class="task-detail-subtitle"></div>
    <div id="taskDetailFields"></div>
    <div class="actions">
      <button class="secondary" id="taskDetailOpenChecklist">Open in Checklist</button>
      <div class="spacer"></div>
      <button class="secondary" id="taskDetailClose">Close</button>
    </div>
  </div>
</div>

<script>
const STATUS_OPTIONS = [
  ['not_started', 'Not Started'],
  ['in_progress', 'In Progress'],
  ['waiting', 'Waiting'],
  ['done', 'Done'],
  ['n_a', 'N/A'],
];
const STATUS_LABELS = Object.fromEntries(STATUS_OPTIONS);

let cycles = [];
let users = [];
let tasks = [];
let currentCycleId = null;
let overviewData = { cycles: [], rows: [] };
let currentView = 'overview';

function showConfirm(message, { okLabel = 'Delete', danger = true } = {}) {
  return new Promise((resolve) => {
    const backdrop = document.getElementById('confirmModalBackdrop');
    document.getElementById('confirmModalMessage').textContent = message;
    backdrop.classList.add('show');

    const okBtn = document.getElementById('confirmModalOk');
    const cancelBtn = document.getElementById('confirmModalCancel');
    okBtn.textContent = okLabel;
    okBtn.className = danger ? 'danger' : '';

    const cleanup = (result) => {
      backdrop.classList.remove('show');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      resolve(result);
    };
    const onOk = () => cleanup(true);
    const onCancel = () => cleanup(false);

    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
  });
}

async function api(path, opts) {
  const res = await fetch('/api' + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || res.statusText);
  }
  return res.status === 204 ? null : res.json();
}

function isComplete(t) {
  const bookingDone = t.booking_status === 'done' || t.booking_status === 'n_a';
  const checkDone = !t.quality_check_id || t.check_status === 'done' || t.check_status === 'n_a';
  return bookingDone && checkDone;
}

function statusSelectHtml(field, value, id) {
  const opts = STATUS_OPTIONS.map(([v, label]) =>
    `<option value="${v}" ${v === value ? 'selected' : ''}>${label}</option>`).join('');
  return `<select class="status-select status-${value}" data-field="${field}" data-id="${id}">${opts}</select>`;
}

function userSelectHtml(field, value, id) {
  const opts = ['<option value="">—</option>'].concat(
    users.map((u) => `<option value="${u.id}" ${u.id === value ? 'selected' : ''}>${u.name}</option>`),
  ).join('');
  return `<select data-field="${field}" data-id="${id}">${opts}</select>`;
}

function linkHtml(url, label) {
  return url ? `<a href="${url}" target="_blank" rel="noopener" title="${label}">${label}</a>` : '';
}

function renderCycleSelect() {
  const sel = document.getElementById('cycleSelect');
  sel.innerHTML = cycles.map((c) => `<option value="${c.id}" ${c.id === currentCycleId ? 'selected' : ''}>${c.label}</option>`).join('');
}

function renderCycleStatus() {
  const cycle = cycles.find((c) => c.id === currentCycleId);
  const badge = document.getElementById('cycleStatusBadge');
  const statusSel = document.getElementById('cycleStatusSelect');
  if (!cycle) { badge.textContent = ''; statusSel.innerHTML = ''; return; }
  badge.textContent = cycle.status;
  badge.className = 'cycle-badge ' + cycle.status;
  statusSel.innerHTML = ['open', 'locked', 'archived']
    .map((s) => `<option value="${s}" ${s === cycle.status ? 'selected' : ''}>${s}</option>`).join('');
}

function renderTasks() {
  const hideCompleted = document.getElementById('hideCompleted').checked;
  const respFilter = document.getElementById('filterBookingResp').value;
  const statusFilter = document.getElementById('filterBookingStatus').value;
  const qcFilter = document.getElementById('filterQualityCheck').value;
  const body = document.getElementById('taskBody');

  const visible = tasks.filter((t) => {
    if (hideCompleted && isComplete(t)) return false;
    if (respFilter === 'unassigned' && t.booking_responsible_id) return false;
    if (respFilter && respFilter !== 'unassigned' && String(t.booking_responsible_id) !== respFilter) return false;
    if (statusFilter && t.booking_status !== statusFilter) return false;
    if (qcFilter === 'unassigned' && t.quality_check_id) return false;
    if (qcFilter && qcFilter !== 'unassigned' && String(t.quality_check_id) !== qcFilter) return false;
    return true;
  });

  document.getElementById('emptyState').style.display = cycles.length ? 'none' : 'block';
  document.getElementById('taskTable').style.display = cycles.length ? '' : 'none';

  body.innerHTML = visible.map((t) => `
    <tr data-id="${t.id}" class="${isComplete(t) ? 'completed-row' : ''}">
      <td class="drag-handle" draggable="true" data-drag-handle>⠿</td>
      <td class="col-name"><input type="text" data-field="task_name" data-id="${t.id}" value="${escAttr(t.task_name)}"></td>
      <td class="col-desc"><textarea data-field="description" data-id="${t.id}">${escHtml(t.description)}</textarea></td>
      <td><input type="text" data-field="dependency_text" data-id="${t.id}" value="${escAttr(t.dependency_text)}"></td>
      <td><input type="text" data-field="due_date" data-id="${t.id}" value="${escAttr(t.due_date)}"></td>
      <td>${userSelectHtml('booking_responsible_id', t.booking_responsible_id, t.id)}</td>
      <td>${statusSelectHtml('booking_status', t.booking_status, t.id)}</td>
      <td>${userSelectHtml('quality_check_id', t.quality_check_id, t.id)}</td>
      <td>${statusSelectHtml('check_status', t.check_status, t.id)}</td>
      <td><input type="date" data-field="date_finished" data-id="${t.id}" value="${t.date_finished ? t.date_finished.slice(0,10) : ''}"></td>
      <td><textarea data-field="comment" data-id="${t.id}">${escHtml(t.comment)}</textarea></td>
      <td class="col-links">
        <div class="link-row">
          <input type="text" data-field="url" data-id="${t.id}" placeholder="Link URL" value="${escAttr(t.url)}">
          ${linkHtml(t.url, '🔗')}
        </div>
        <div class="link-row">
          <input type="text" data-field="powerbi_url" data-id="${t.id}" placeholder="Power BI URL" value="${escAttr(t.powerbi_url)}">
          ${linkHtml(t.powerbi_url, '📊')}
        </div>
      </td>
      <td><button class="danger" data-action="delete" data-id="${t.id}" title="Delete task">✕</button></td>
    </tr>
  `).join('');
}

function renderFilterOptions() {
  const respSel = document.getElementById('filterBookingResp');
  const qcSel = document.getElementById('filterQualityCheck');
  const statusSel = document.getElementById('filterBookingStatus');
  const prevResp = respSel.value, prevQc = qcSel.value, prevStatus = statusSel.value;

  const userOptionsHtml = users.map((u) => `<option value="${u.id}">${escHtml(u.name)}</option>`).join('')
    + '<option value="unassigned">— Unassigned —</option>';

  respSel.innerHTML = `<option value="">All Booking Responsible</option>${userOptionsHtml}`;
  qcSel.innerHTML = `<option value="">All Quality Check</option>${userOptionsHtml}`;
  statusSel.innerHTML = '<option value="">All Booking Status</option>'
    + STATUS_OPTIONS.map(([v, label]) => `<option value="${v}">${label}</option>`).join('');

  respSel.value = prevResp;
  qcSel.value = prevQc;
  statusSel.value = prevStatus;
}

function escHtml(v) { return (v || '').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escAttr(v) { return (v || '').replace(/"/g, '&quot;'); }

async function loadCycles() {
  cycles = await api('/cycles');
  if (!currentCycleId && cycles.length) currentCycleId = cycles[0].id;
  renderCycleSelect();
  renderCycleStatus();
}

async function loadUsers() {
  users = await api('/users');
  renderFilterOptions();
}

async function loadTasks() {
  tasks = currentCycleId ? await api(`/cycles/${currentCycleId}/tasks`) : [];
  renderTasks();
}

async function loadOverview() {
  overviewData = await api('/report/pivot');
  renderOverview();
}

function renderOverview() {
  const { cycles: overviewCycles, rows } = overviewData;

  document.getElementById('overviewEmptyState').style.display = overviewCycles.length ? 'none' : 'block';
  document.getElementById('overviewTableWrap').style.display = overviewCycles.length ? '' : 'none';
  if (!overviewCycles.length) return;

  document.getElementById('overviewHeaderRow').innerHTML = '<th class="col-name">Task</th>'
    + overviewCycles.map((c) => `<th style="text-align:center"><button class="cycle-link" data-cycle-id="${c.id}">${escHtml(c.label)}</button></th>`).join('');

  document.getElementById('overviewBody').innerHTML = rows.map((r) => `
    <tr>
      <td class="col-name">${escHtml(r.task_name)}</td>
      ${overviewCycles.map((c) => {
        const cell = r.cells[c.id];
        if (!cell) return '<td class="overview-cell">—</td>';
        const label = STATUS_LABELS[cell.booking_status] || cell.booking_status;
        const dateHtml = (cell.booking_status === 'done' && cell.date_finished)
          ? `<div class="overview-date">${cell.date_finished.slice(0, 10)}</div>` : '';
        return `<td class="overview-cell"><button class="status-pill pill-btn status-${cell.booking_status}" data-task-id="${cell.task_id}" data-cycle-id="${c.id}">${label}</button>${dateHtml}</td>`;
      }).join('')}
    </tr>
  `).join('');
}

function switchView(view) {
  currentView = view;
  document.getElementById('overviewPanel').style.display = view === 'overview' ? '' : 'none';
  document.getElementById('checklistPanel').style.display = view === 'checklist' ? '' : 'none';
  document.getElementById('checklistHeaderControls').style.display = view === 'checklist' ? 'flex' : 'none';
  document.getElementById('tabOverviewBtn').classList.toggle('active', view === 'overview');
  document.getElementById('tabChecklistBtn').classList.toggle('active', view === 'checklist');
}

// ---- Task detail modal (quick edit from Overview) ----

let taskDetailCycleId = null;

function renderTaskDetailFields(task) {
  document.getElementById('taskDetailTitle').textContent = task.task_name;
  document.getElementById('taskDetailSubtitle').textContent = task.cycle_label;

  document.getElementById('taskDetailFields').innerHTML = `
    <div class="field">
      <label>Description</label>
      <textarea data-field="description" data-id="${task.id}">${escHtml(task.description)}</textarea>
    </div>
    <div class="field">
      <label>Dependency</label>
      <input type="text" data-field="dependency_text" data-id="${task.id}" value="${escAttr(task.dependency_text)}">
    </div>
    <div class="field">
      <label>Due</label>
      <input type="text" data-field="due_date" data-id="${task.id}" value="${escAttr(task.due_date)}">
    </div>
    <div class="field">
      <label>Booking Responsible</label>
      ${userSelectHtml('booking_responsible_id', task.booking_responsible_id, task.id)}
    </div>
    <div class="field">
      <label>Booking Status</label>
      ${statusSelectHtml('booking_status', task.booking_status, task.id)}
    </div>
    <div class="field">
      <label>Quality Check</label>
      ${userSelectHtml('quality_check_id', task.quality_check_id, task.id)}
    </div>
    <div class="field">
      <label>Check Status</label>
      ${statusSelectHtml('check_status', task.check_status, task.id)}
    </div>
    <div class="field">
      <label>Finished</label>
      <input type="date" data-field="date_finished" data-id="${task.id}" value="${task.date_finished ? task.date_finished.slice(0, 10) : ''}">
    </div>
    <div class="field">
      <label>Comment</label>
      <textarea data-field="comment" data-id="${task.id}">${escHtml(task.comment)}</textarea>
    </div>
    <div class="field">
      <label>Link URL</label>
      <div class="link-row">
        <input type="text" data-field="url" data-id="${task.id}" placeholder="Link URL" value="${escAttr(task.url)}">
        ${linkHtml(task.url, '🔗')}
      </div>
    </div>
    <div class="field">
      <label>Power BI URL</label>
      <div class="link-row">
        <input type="text" data-field="powerbi_url" data-id="${task.id}" placeholder="Power BI URL" value="${escAttr(task.powerbi_url)}">
        ${linkHtml(task.powerbi_url, '📊')}
      </div>
    </div>
  `;
}

async function openTaskDetail(taskId, cycleId) {
  const task = await api(`/tasks/${taskId}`);
  taskDetailCycleId = cycleId;
  renderTaskDetailFields(task);
  document.getElementById('taskDetailModalBackdrop').classList.add('show');
}

async function refreshAll() {
  await loadUsers();
  await loadCycles();
  await loadTasks();
  switchView('overview');
  await loadOverview();
}

// ---- Event wiring ----

document.getElementById('tabOverviewBtn').addEventListener('click', async () => {
  switchView('overview');
  await loadOverview();
});

document.getElementById('tabChecklistBtn').addEventListener('click', () => switchView('checklist'));

document.getElementById('overviewHeaderRow').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-cycle-id]');
  if (!btn) return;
  currentCycleId = parseInt(btn.dataset.cycleId, 10);
  switchView('checklist');
  renderCycleSelect();
  renderCycleStatus();
  await loadTasks();
});

document.getElementById('overviewBody').addEventListener('click', async (e) => {
  const btn = e.target.closest('.pill-btn');
  if (!btn) return;
  await openTaskDetail(btn.dataset.taskId, parseInt(btn.dataset.cycleId, 10));
});

document.getElementById('taskDetailClose').addEventListener('click', () => {
  document.getElementById('taskDetailModalBackdrop').classList.remove('show');
});

document.getElementById('taskDetailOpenChecklist').addEventListener('click', async () => {
  document.getElementById('taskDetailModalBackdrop').classList.remove('show');
  currentCycleId = taskDetailCycleId;
  switchView('checklist');
  renderCycleSelect();
  renderCycleStatus();
  await loadTasks();
});

document.getElementById('taskDetailFields').addEventListener('change', async (e) => {
  const el = e.target;
  const field = el.dataset.field;
  if (!field) return;
  const id = el.dataset.id;
  let value = el.value;
  if (field.endsWith('_id')) value = value ? parseInt(value, 10) : null;
  const updated = await api(`/tasks/${id}`, { method: 'PATCH', body: JSON.stringify({ [field]: value || null }) });

  if (field === 'booking_status' || field === 'check_status') {
    el.className = `status-select status-${value}`;
  }

  for (const row of overviewData.rows || []) {
    const cell = row.cells[taskDetailCycleId];
    if (cell && cell.task_id === parseInt(id, 10)) {
      cell.booking_status = updated.booking_status;
      cell.date_finished = updated.date_finished;
    }
  }
  renderOverview();
});

document.getElementById('cycleSelect').addEventListener('change', async (e) => {
  currentCycleId = parseInt(e.target.value, 10);
  renderCycleStatus();
  await loadTasks();
});

document.getElementById('cycleStatusSelect').addEventListener('change', async (e) => {
  await api(`/cycles/${currentCycleId}`, { method: 'PATCH', body: JSON.stringify({ status: e.target.value }) });
  await loadCycles();
});

document.getElementById('hideCompleted').addEventListener('change', renderTasks);

['filterBookingResp', 'filterBookingStatus', 'filterQualityCheck'].forEach((id) => {
  document.getElementById(id).addEventListener('change', renderTasks);
});

document.getElementById('clearFiltersBtn').addEventListener('click', () => {
  document.getElementById('filterBookingResp').value = '';
  document.getElementById('filterBookingStatus').value = '';
  document.getElementById('filterQualityCheck').value = '';
  renderTasks();
});

const taskModalBackdrop = document.getElementById('taskModalBackdrop');

document.getElementById('addTaskBtn').addEventListener('click', () => {
  if (!currentCycleId) return alert('Create a cycle first.');
  document.getElementById('taskNameInput').value = '';
  taskModalBackdrop.classList.add('show');
  document.getElementById('taskNameInput').focus();
});

document.getElementById('taskModalCancel').addEventListener('click', () => taskModalBackdrop.classList.remove('show'));

async function saveNewTask() {
  const nameEl = document.getElementById('taskNameInput');
  const task_name = nameEl.value.trim();
  if (!task_name) return;
  await api(`/cycles/${currentCycleId}/tasks`, { method: 'POST', body: JSON.stringify({ task_name }) });
  taskModalBackdrop.classList.remove('show');
  await loadTasks();
}

document.getElementById('taskModalSave').addEventListener('click', saveNewTask);
document.getElementById('taskNameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') saveNewTask();
});

document.getElementById('taskBody').addEventListener('change', async (e) => {
  const el = e.target;
  const field = el.dataset.field;
  if (!field) return;
  const id = el.dataset.id;
  let value = el.value;
  if (field.endsWith('_id')) value = value ? parseInt(value, 10) : null;
  await api(`/tasks/${id}`, { method: 'PATCH', body: JSON.stringify({ [field]: value || null }) });
  const t = tasks.find((x) => x.id === parseInt(id, 10));
  if (t) t[field] = value;
  renderTasks();
});

document.getElementById('taskBody').addEventListener('click', async (e) => {
  if (e.target.dataset.action === 'delete') {
    if (!await showConfirm('Delete this task?')) return;
    await api(`/tasks/${e.target.dataset.id}`, { method: 'DELETE' });
    await loadTasks();
  }
});

// ---- Drag-and-drop reordering ----

let draggedTaskId = null;
const taskBodyEl = document.getElementById('taskBody');

taskBodyEl.addEventListener('dragstart', (e) => {
  const handle = e.target.closest('[data-drag-handle]');
  if (!handle) { e.preventDefault(); return; }
  const row = handle.closest('tr');
  draggedTaskId = row.dataset.id;
  e.dataTransfer.effectAllowed = 'move';
  row.classList.add('dragging');
});

taskBodyEl.addEventListener('dragend', (e) => {
  const row = e.target.closest('tr');
  if (row) row.classList.remove('dragging');
  taskBodyEl.querySelectorAll('tr.drag-over').forEach((r) => r.classList.remove('drag-over'));
  draggedTaskId = null;
});

taskBodyEl.addEventListener('dragover', (e) => {
  if (!draggedTaskId) return;
  e.preventDefault();
  const row = e.target.closest('tr');
  if (!row || row.dataset.id === draggedTaskId) return;
  taskBodyEl.querySelectorAll('tr.drag-over').forEach((r) => r.classList.remove('drag-over'));
  row.classList.add('drag-over');
});

taskBodyEl.addEventListener('drop', async (e) => {
  e.preventDefault();
  const targetRow = e.target.closest('tr');
  if (!targetRow || !draggedTaskId || targetRow.dataset.id === draggedTaskId) return;

  const targetId = targetRow.dataset.id;
  const draggedIndex = tasks.findIndex((t) => String(t.id) === draggedTaskId);
  const targetIndex = tasks.findIndex((t) => String(t.id) === targetId);
  if (draggedIndex === -1 || targetIndex === -1) return;

  const reordered = [...tasks];
  const [moved] = reordered.splice(draggedIndex, 1);
  reordered.splice(targetIndex, 0, moved);
  tasks = reordered;
  renderTasks();

  try {
    await api(`/cycles/${currentCycleId}/tasks/reorder`, {
      method: 'POST',
      body: JSON.stringify({ order: tasks.map((t) => t.id) }),
    });
  } catch (err) {
    await loadTasks();
    alert('Could not save the new order: ' + err.message);
  }
});

// ---- Cycle modal (new cycle only — clone is a one-click action below) ----

const cycleModalBackdrop = document.getElementById('cycleModalBackdrop');

document.getElementById('newCycleBtn').addEventListener('click', () => {
  document.getElementById('cycleModalTitle').textContent = 'New Cycle';
  document.getElementById('cycleLabelInput').value = '';
  document.getElementById('cycleYearInput').value = new Date().getFullYear();
  document.getElementById('cycleMonthInput').value = '';
  cycleModalBackdrop.classList.add('show');
});

document.getElementById('cycleModalCancel').addEventListener('click', () => cycleModalBackdrop.classList.remove('show'));

document.getElementById('cycleModalSave').addEventListener('click', async () => {
  const label = document.getElementById('cycleLabelInput').value.trim();
  const year = parseInt(document.getElementById('cycleYearInput').value, 10);
  const month = parseInt(document.getElementById('cycleMonthInput').value, 10);
  if (!label || !year || !month) return alert('Label, year and month are required.');

  const created = await api('/cycles', { method: 'POST', body: JSON.stringify({ label, year, month }) });

  cycleModalBackdrop.classList.remove('show');
  currentCycleId = created.id;
  await loadCycles();
  await loadTasks();
});

document.getElementById('cloneCycleBtn').addEventListener('click', async () => {
  if (!currentCycleId) return alert('No cycle selected to clone.');
  const cycle = cycles.find((c) => c.id === currentCycleId);
  let { year, month } = cycle;
  month += 1;
  if (month > 12) { month = 1; year += 1; }
  const nextLabel = `${year}-${String(month).padStart(2, '0')}`;

  if (!await showConfirm(`Clone ${cycle.label} into new cycle ${nextLabel}?`, { okLabel: 'Clone', danger: false })) return;

  let created;
  try {
    created = await api(`/cycles/${currentCycleId}/clone`, { method: 'POST', body: JSON.stringify({}) });
  } catch (err) {
    return alert('Could not clone: ' + err.message);
  }

  currentCycleId = created.id;
  await loadCycles();
  await loadTasks();
});

// ---- Users modal ----

const usersModalBackdrop = document.getElementById('usersModalBackdrop');

function renderUsersList() {
  document.getElementById('usersList').innerHTML = users.map((u) => `
    <div class="user-row">
      <span>${escHtml(u.name)}</span>
      <label><input type="checkbox" data-user-active="${u.id}" ${u.active ? 'checked' : ''}> active</label>
    </div>
  `).join('');
}

document.getElementById('manageUsersBtn').addEventListener('click', () => {
  renderUsersList();
  usersModalBackdrop.classList.add('show');
});

document.getElementById('usersModalClose').addEventListener('click', async () => {
  usersModalBackdrop.classList.remove('show');
  await loadUsers();
  renderTasks();
});

document.getElementById('usersModalAdd').addEventListener('click', async () => {
  const nameEl = document.getElementById('newUserName');
  const name = nameEl.value.trim();
  if (!name) return;
  await api('/users', { method: 'POST', body: JSON.stringify({ name }) });
  nameEl.value = '';
  await loadUsers();
  renderUsersList();
});

document.getElementById('usersList').addEventListener('change', async (e) => {
  const userId = e.target.dataset.userActive;
  if (!userId) return;
  await api(`/users/${userId}`, { method: 'PATCH', body: JSON.stringify({ active: e.target.checked }) });
});

refreshAll();
</script>
