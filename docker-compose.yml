services:
  postgres:
    image: postgres:15-alpine
    container_name: monthend_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: monthend
      POSTGRES_USER: monthend
      POSTGRES_PASSWORD: monthend
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monthend"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    container_name: monthend_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: monthend
      DB_USER: monthend
      DB_PASSWORD: monthend
      PORT: 3000
      PUBLIC_DIR: /app/public
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3001}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./frontend:/app/public:ro

  # Reverse proxy with automatic HTTPS (Let's Encrypt). Only used in
  # production, behind a real domain — `docker compose up` (no profile flag)
  # skips it entirely, so local dev is unaffected.
  caddy:
    image: caddy:2-alpine
    container_name: monthend_caddy
    restart: unless-stopped
    profiles: ["production"]
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
