services:
  postgres:
    image: postgres:15-alpine
    container_name: monthend_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: monthend
      POSTGRES_USER: monthend
      POSTGRES_PASSWORD: monthend
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monthend"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    container_name: monthend_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: monthend
      DB_USER: monthend
      DB_PASSWORD: monthend
      PORT: 3000
      PUBLIC_DIR: /app/public
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app/public:ro

volumes:
  pgdata:
